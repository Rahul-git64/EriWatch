[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-api"
version = "0.1.0"
description = "EriWatch FastAPI backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eriwatch_api"]
