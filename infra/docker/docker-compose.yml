services:
  db:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.db
    container_name: eriwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eriwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eriwatch_local}
      POSTGRES_DB: ${POSTGRES_DB:-eriwatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eriwatch_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-eriwatch} -d $${POSTGRES_DB:-eriwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: eriwatch-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eriwatch}:${POSTGRES_PASSWORD:-eriwatch_local}@db:5432/${POSTGRES_DB:-eriwatch}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: eriwatch-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  n8n:
    image: n8nio/n8n:1.68.0
    container_name: eriwatch-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: 5678
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-eriwatch_n8n_local}
      GENERIC_TIMEZONE: Asia/Kolkata
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - eriwatch_n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  eriwatch_pgdata:
  eriwatch_n8n_data:
