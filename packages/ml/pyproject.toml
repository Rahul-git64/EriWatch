[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-ml"
version = "0.1.0"
description = "EriWatch forecasting, risk classification, baselines, and explainability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eriwatch_ml"]
