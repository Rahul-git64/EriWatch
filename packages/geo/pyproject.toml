[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-geo"
version = "0.1.0"
description = "EriWatch satellite ingestion, SCL cloud masking, NDWI/MNDWI water spread and tank registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "rasterio>=1.4.4",
    "shapely>=2.2.0",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "pyproj>=3.7.2",
    "pyarrow>=26.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eriwatch_geo"]
