[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-geo"
version = "0.1.0"
description = "EriWatch satellite ingestion, SCL cloud masking, NDWI/MNDWI water spread and tank registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eriwatch_geo"]
