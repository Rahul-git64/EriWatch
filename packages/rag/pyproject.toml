[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-rag"
version = "0.1.0"
description = "EriWatch grounded legal RAG, complaint structuring, and cited petition engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pypdf>=5.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eriwatch_rag"]
