[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eriwatch-workspace"
version = "0.1.0"
description = "EriWatch monorepo Python workspace (API, Geospatial, ML, and Grounded RAG packages)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "eriwatch-api",
    "eriwatch-geo",
    "eriwatch-ml",
    "eriwatch-rag",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "httpx2>=0.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pypdfium2>=5.14.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.uv.sources]
eriwatch-api = { workspace = true }
eriwatch-geo = { workspace = true }
eriwatch-ml = { workspace = true }
eriwatch-rag = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/geo",
    "packages/ml",
    "packages/rag",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/geo/src/eriwatch_geo"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "apps/api/src",
    "packages/geo/src",
    "packages/ml/src",
    "packages/rag/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = [
    "apps/api/src",
    "packages/geo/src",
    "packages/ml/src",
    "packages/rag/src",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "rasterio",
    "rasterio.*",
    "shapely",
    "shapely.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "apps/api/tests",
    "packages/geo/tests",
    "packages/ml/tests",
    "packages/rag/tests",
]
pythonpath = [
    "apps/api/src",
    "packages/geo/src",
    "packages/ml/src",
    "packages/rag/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: marks tests that require live external network calls",
]
